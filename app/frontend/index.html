<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#0071e3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>Dogar Trading Corporation</title>

    <!-- Tailwind utilities are compiled into the SPA bundle (src/index.css +
         tailwind.config.js) instead of the Play CDN, so the production console
         warning about the Play CDN no longer appears. The shared app.css keeps
         the bespoke component classes identical to the original UI. -->
    <!-- AUDIT FIX (2026-07-06): switched FontAwesome + Inter/JetBrains fonts from
         external CDNs (jsdelivr / Google Fonts) to the self-hosted vendored copies
         already shipped in /static/vendor/. This removes the
         third-party runtime dependency (reliability + PII privacy), and lets the
         CSP tighten to 'self' without breaking icons/fonts. -->
    <!-- PERF: font preloads.
         Webfonts declared in a stylesheet are only discovered AFTER that
         stylesheet has been fetched and parsed, so the first paint of the shell
         used to show fallback glyphs and then reflow. These two files cover
         everything visible on first paint — Inter 400/600 for body + headings,
         and the FontAwesome solid face used by every sidebar, topbar and button
         icon — so they start downloading with the HTML instead of one round trip
         later. Deliberately NOT preloading Inter 500/700 or fa-brands (108 KB):
         those are used further down the page or not at all on most routes, and
         preloading them would just compete for bandwidth with the bundle. -->
    <link rel="preload" href="/static/vendor/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/vendor/fonts/Inter-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/vendor/fonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Enterprise display font: Plus Jakarta Sans (headings, brand, stat values) -->
    <link rel="preload" href="/static/vendor/fonts/PlusJakartaSans-Bold.woff2" as="font" type="font/woff2" crossorigin>

    <!-- PERF (2026-08-02): fa-subset.min.css, NOT all.min.css.
         The complete FontAwesome 6.4.0 stylesheet is 101,965 bytes, and 69% of
         that is the per-icon `content:` rules for all 1,856 icons. This portal
         references 183 of them. Because the file render-blocks every route in
         both shells, it was the largest remaining item on the critical path:
         101,965 -> 23,779 bytes, 22,373 -> 4,448 gzipped, and ~1,700 fewer
         selectors for the style engine to match on every recalculation.

         GENERATED by scripts/build_fa_subset.py from the full stylesheet, which
         is still on disk (reverting = changing this href back). Icon names that
         are composed at runtime, e.g. `fa-align-${a}`, cannot be found by
         scanning and are declared explicitly in that script's DYNAMIC map.
         tests/test_fa_subset.py fails the build if the subset is stale, if any
         referenced icon is missing from it, or if a new runtime-composed name
         appears without being declared. -->
    <link rel="stylesheet" href="/static/vendor/css/fa-subset.min.css">
    <link rel="stylesheet" href="/static/vendor/fonts/fontawesome.css">
    <link rel="stylesheet" href="/static/vendor/css/inter.css">

    <!-- AUDIT FIX (2026-07-07): Chart.js is loaded from the SELF-HOSTED vendored
         bundle instead of https://cdn.jsdelivr.net/npm/chart.js — the strict CSP
         (app/core/csp_nonce.py: script-src 'self' 'nonce-…') blocks any external
         script, so the CDN copy never executed and the Dashboard charts silently
         failed to render.

         PERF 2026-08-01: the <script> tag that used to live here is GONE. It was
         a classic, non-deferred script in <head>, so the browser stopped parsing
         the document and downloaded + evaluated 205 KB (68 KB gzipped) before it
         could even discover the React module bundle — on every route, including
         /login, for every user who never opens the Dashboard. Chart.js is used by
         exactly one page and always through ensureChart(), so src/lib/chart.ts
         now injects the same self-hosted bundle on first use. Injecting a
         same-origin <script src> is allowed by `script-src 'self'` (the nonce
         only governs INLINE scripts). ensureChart() resolves immediately when
         window.Chart is already defined and never injects a second copy. -->
    <!-- v23.0 — light glassmorphism layer (app.css v19). The query string is a
         cache bust: app.css is served as a standalone static file (NOT bundled
         by Vite), so it does not get a content hash in its filename and a
         returning browser would otherwise keep serving the pre-glass copy from
         disk cache. Bump this whenever app.css changes visibly. -->
    <!-- v24.1: restores the <select> dropdown caret that the glass layer's
         `background` shorthand had been erasing app-wide (measured
         2026-08-19: backgroundImage computed to "none" with appearance:none
         and 36px of padding held for an arrow that never painted). A stale
         cached stylesheet would keep every dropdown looking like a text box. -->
    <link rel="stylesheet" href="/static/css/app.css?v=24.1">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">

    <!-- Brand theme switch (blue ⇄ forest-green) — same logic as base.html.
         Applies the `.theme-forest-green` class BEFORE first paint so the
         compiled --blue-* CSS variables (src/index.css) swap to green with no
         flash. No runtime Tailwind config needed anymore. -->
    <script>
      (function () {
        const cachedTheme = localStorage.getItem('theme') || 'corporate-blue';
        if (cachedTheme === 'forest-green') {
          document.documentElement.classList.add('theme-forest-green');
        }
      })();
    </script>

    <!-- Forest-green theme component overrides moved to src/index.css
         (was here as an inline <style> block, but the strict CSP header
          style-src-elem 'self' 'nonce-…' blocks nonce-less <style>
          elements. The bundled stylesheet loads under 'self' and is not
          blocked, so this comment is all that stays here.) -->

</head>
<!-- No `bg-slate-50` here. It used to be, and it silently defeated the ambient
     glass canvas: a Tailwind utility class on <body> sets background-color with
     higher specificity than the `body` type selector in /static/css/app.css, so
     the v19 canvas painted its radial tints over #f8fafc instead of its own
     #eef2f8 base. Measured proof of the override -- computed bodyBgColor read
     rgb(248,250,252) while app.css asked for rgb(238,242,248).
     The base colour now comes from app.css (v19 layer) together with the
     gradients, so the two cannot drift apart, and the `.theme-forest-green`
     variant can re-tint it. -->
<body class="text-slate-800 min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
