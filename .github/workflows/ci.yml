name: CI

# Continuous Integration for the OEP recruitment portal.
# Runs on every push to main and on pull requests. Four independent jobs:
#   1. python-lint  — ruff static analysis of the FastAPI backend
#   2. python-tests — full pytest suite (SQLite, TESTING=true)
#   3. frontend     — TypeScript type-check (tsc) + Vite production build
#   4. build-gate   — aggregates the above so branch protection needs one check
#
# Jobs run in parallel; caches keep them fast.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. Backend lint (ruff)
  # ────────────────────────────────────────────────────────────────
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check . --output-format=github

  # ────────────────────────────────────────────────────────────────
  # 2. Backend tests (pytest)
  # ────────────────────────────────────────────────────────────────
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    env:
      TESTING: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q --tb=short

  # ────────────────────────────────────────────────────────────────
  # 3. Frontend type-check + build (Vite / TypeScript)
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -b --noEmit

      - name: Production build
        run: npm run build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: app/static/spa
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # 4. Aggregate gate — single required status for branch protection
  # ────────────────────────────────────────────────────────────────
  build-gate:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [python-lint, python-tests, frontend]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.python-lint.result }}" != "success" ] || \
             [ "${{ needs.python-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed ✅"
