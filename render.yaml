services:
  - type: web
    name: dogar-portal-com
    runtime: docker
    repo: https://github.com/Hussnainaltaf/Dogar-Portal-Render
    branch: main
    # SQLite and uploaded documents require persistent storage.
    # Keep one instance until the documented PostgreSQL migration is completed.
    plan: starter
    region: singapore
    healthCheckPath: /api/ping
    autoDeploy: true
    disk:
      name: dogar-portal-data
      mountPath: /app/data
      sizeGB: 10
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENV
        value: production
      - key: USE_SPA
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////app/data/dogar_trading.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: PDF_BG_DIR
        value: /app/data/pdf_backgrounds
      - key: ALLOWED_HOSTS
        value: dogar-portal-com.onrender.com
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: VENDOR_ADMIN_EMAIL
        sync: false
      - key: VENDOR_ADMIN_PASSWORD
        sync: false
      - key: VENDOR_ADMIN_NAME
        value: Render Vendor Admin
